name: 01 - Infrastructure Pipeline (Terraform)

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, closed ]
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # CI: Validación y Plan (Se ejecuta al abrir/actualizar PR)
  # -------------------------------------------------------------------------
  terraform-ci:
    name: Terraform CI (Validate & Plan)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticar en AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Validate
        run: |
          terraform init
          terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./terraform

  # -------------------------------------------------------------------------
  # CD: Aplicación de cambios (Se ejecuta únicamente al hacer Merge a Main)
  # -------------------------------------------------------------------------
  terraform-cd:
    name: Terraform CD (Apply)
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticar en AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve
        working-directory: ./terraform